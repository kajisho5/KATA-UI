<div style="display:grid;gap:18px;max-width:420px;width:100%">
  <div style="display:grid;gap:7px">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span style="font-weight:550">Storage</span><span style="font-family:var(--k-mono);color:var(--k-ink-2)">72 / 100 GB</span></div>
    <div class="k-meter" role="meter" aria-label="Storage used" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100"><div class="k-meter-track"><div class="k-meter-fill" style="width:72%"></div></div><div class="k-meter-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>
  </div>
  <div style="display:grid;gap:7px">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span style="font-weight:550">Export queue</span><span style="font-family:var(--k-mono);color:var(--k-ink-2)">88%</span></div>
    <div class="k-meter" data-tone="warning" role="meter" aria-label="Export queue load" aria-valuenow="88" aria-valuemin="0" aria-valuemax="100"><div class="k-meter-track"><div class="k-meter-fill" style="width:88%"></div></div></div>
  </div>
  <div style="display:grid;gap:7px">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span style="font-weight:550">Failed jobs</span><span style="font-family:var(--k-mono);color:var(--k-ink-2)">96%</span></div>
    <div class="k-meter" data-tone="critical" role="meter" aria-label="Failed job ratio" aria-valuenow="96" aria-valuemin="0" aria-valuemax="100"><div class="k-meter-track"><div class="k-meter-fill" style="width:96%"></div></div></div>
  </div>
</div>
