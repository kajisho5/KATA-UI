<!-- example: Search with an attached button -->
<div class="k-igroup" style="max-width:380px">
  <input class="input" type="search" placeholder="Search the catalog" aria-label="Search the catalog">
  <button class="btn btn-sec btn-md" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.5-4.5"/></svg> Search</button>
</div>
<!-- example: Unit on the right -->

  <span class="k-ig-addon">min</span>
</div>
