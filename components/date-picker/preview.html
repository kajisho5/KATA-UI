<div class="k-dp" data-dp style="max-width:300px">
  <div class="wrap-in">
    <input class="input" data-dp-input type="text" placeholder="Pick a date" readonly aria-haspopup="dialog" aria-expanded="false" style="width:100%;padding-right:42px">
    <button class="cal-btn" data-dp-btn type="button" aria-label="Open calendar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
  </div>
  <div class="k-dp-panel" data-dp-panel role="dialog" aria-label="Choose a date" hidden>
    <div class="k-dp-h">
      <button class="k-dp-nav" data-dp-prev type="button" aria-label="Previous month"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <b data-dp-title></b>
      <button class="k-dp-nav" data-dp-next type="button" aria-label="Next month"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <div class="k-dp-wd"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
    <div class="k-dp-grid" data-dp-grid></div>
  </div>
</div>
