  <g font-size="12" font-weight="600" fill="#52525b">
    <text x="114" y="1260">Measure</text><text x="760" y="1260" text-anchor="end">A</text><text x="900" y="1260" text-anchor="end">B</text><text x="1166" y="1260" text-anchor="end">How</text>
  </g>
  <line x1="90" x2="1190" y1="1272" y2="1272" stroke="#e4e4e7"/>
