  <text x="114" y="1457" font-size="14" font-weight="600" fill="#18181b">Prompt</text>
  <path d="M1160 1446 l6 6 6 -6" fill="none" stroke="#52525b" stroke-width="1.7" stroke-linecap="square"/>

  <text x="90" y="1530" font-size="12" fill="#52525b" font-family="'Space Mono', ui-monospace, monospace">02</text>
  <text x="122" y="1532" font-size="22" font-weight="650" fill="#18181b">Sign up form</text>
  <text x="90" y="1570" font-size="12" fill="#71717a">… sections 02–10 repeat the same layout. Under 640px the two shots stack (A above B).</text>
  <line x1="90" x2="1190" y1="1600" y2="1600" stroke="#e4e4e7"/>
  <text x="90" y="1624" font-size="12" fill="#71717a">Not verified: other agents or dates, screen readers, Safari, Firefox, real devices.</text>
