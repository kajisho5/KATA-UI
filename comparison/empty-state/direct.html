<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Projects · Tallyboard</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --text: #1a1d23; --muted: #5b6270;
    --border: #e1e4ea; --input-border: #c3c9d3; --primary: #3b4fd8; --primary-hover: #2f40b8; --primary-text: #fff;
    --tint: #eef0fd; --tint-2: #dfe3fb; --ok: #067647; --focus: #3b4fd8; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #181b21; --text: #e8eaee; --muted: #a3aab6;
      --border: #2c313b; --input-border: #4a505c; --primary: #8a9bff; --primary-hover: #a6b3ff; --primary-text: #0f1115;
      --tint: #1e2340; --tint-2: #2a3160; --ok: #6ce9a6; --focus: #a6b3ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--primary-text); display: grid; place-items: center; font-size: .85rem; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  .page-title { font-size: 1.4rem; margin: 0 0 20px; }
  .empty {
    background: var(--surface); border: 1px dashed var(--input-border); border-radius: 18px;
    padding: 40px 24px; text-align: center;
  }
  .illus { width: 200px; max-width: 70%; height: auto; margin: 0 auto 20px; display: block; }
  .illus .bg { fill: var(--tint); }
  .illus .card { fill: var(--surface); stroke: var(--input-border); }
  .illus .accent { fill: var(--primary); }
  .illus .line { fill: var(--tint-2); }
  .empty h2 { font-size: 1.5rem; margin: 0 0 8px; }
  .empty p { color: var(--muted); margin: 0 auto 24px; max-width: 440px; }
  .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; font: inherit; font-weight: 600;
    border-radius: var(--radius); cursor: pointer; border: 1px solid transparent;
  }
  .btn-primary { background: var(--primary); color: var(--primary-text); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--input-border); }
  .btn-secondary:hover { background: var(--tint); }
  .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .status { margin: 16px 0 0; color: var(--ok); font-weight: 600; min-height: 1.5em; }
  .steps { margin-top: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; }
  .steps-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .steps h2 { font-size: 1.1rem; margin: 0; }
  .progress-text { color: var(--muted); font-size: .9rem; }
  progress { width: 100%; height: 8px; appearance: none; border: 0; border-radius: 999px; overflow: hidden; background: var(--tint); margin-bottom: 16px; }
  progress::-webkit-progress-bar { background: var(--tint); border-radius: 999px; }
  progress::-webkit-progress-value { background: var(--primary); border-radius: 999px; }
  progress::-moz-progress-bar { background: var(--primary); border-radius: 999px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .step { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border: 1px solid var(--border); border-radius: 12px; }
  .step input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--primary); }
  .step label { font-weight: 600; cursor: pointer; }
  .step .desc { display: block; color: var(--muted); font-weight: 400; font-size: .9rem; }
  .step:has(input:checked) label > .t { text-decoration: line-through; color: var(--muted); }
  .num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; background: var(--tint); color: var(--primary); }
  @media (prefers-reduced-motion: no-preference) { .btn { transition: background-color .15s; } }
</style>
</head>
<body>
<header><div class="bar"><span class="logo" aria-hidden="true">T</span>Tallyboard</div></header>
<main>
  <h1 class="page-title">Projects</h1>

  <section class="empty" aria-labelledby="empty-title">
    <svg class="illus" viewBox="0 0 200 140" aria-hidden="true" focusable="false">
      <rect class="bg" x="0" y="0" width="200" height="140" rx="20"/>
      <rect class="card" x="28" y="30" width="62" height="84" rx="8" stroke-width="1.5"/>
      <rect class="accent" x="36" y="40" width="30" height="6" rx="3"/>
      <rect class="line" x="36" y="54" width="46" height="12" rx="4"/>
      <rect class="line" x="36" y="72" width="46" height="12" rx="4"/>
      <rect class="card" x="104" y="30" width="62" height="84" rx="8" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle class="accent" cx="135" cy="72" r="13"/>
      <path d="M135 65v14M128 72h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <h2 id="empty-title">No projects yet</h2>
    <p>Projects hold your team's tasks, boards and deadlines, so create your first one to start planning work.</p>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="create">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Create project
      </button>
      <button type="button" class="btn btn-secondary" id="import">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Import from CSV
      </button>
      <input type="file" id="csv" class="file-input" accept=".csv,text/csv" tabindex="-1" aria-hidden="true">
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="steps" aria-labelledby="steps-title">
    <div class="steps-head">
      <h2 id="steps-title">Getting started</h2>
      <span class="progress-text" id="progress-text">0 of 3 complete</span>
    </div>
    <progress id="progress" max="3" value="0" aria-labelledby="steps-title" aria-describedby="progress-text"></progress>
    <ol>
      <li class="step">
        <span class="num" aria-hidden="true">1</span>
        <input type="checkbox" id="s1">
        <label for="s1"><span class="t">Create your first project</span><span class="desc">Give it a name and pick a board layout.</span></label>
      </li>
      <li class="step">
        <span class="num" aria-hidden="true">2</span>
        <input type="checkbox" id="s2">
        <label for="s2"><span class="t">Invite your teammates</span><span class="desc">Add people by email so you can assign tasks.</span></label>
      </li>
      <li class="step">
        <span class="num" aria-hidden="true">3</span>
        <input type="checkbox" id="s3">
        <label for="s3"><span class="t">Add your first tasks</span><span class="desc">Break the work into tasks with owners and due dates.</span></label>
      </li>
    </ol>
  </section>
</main>

<script>
(function () {
  var status = document.getElementById('status');
  var boxes = document.querySelectorAll('.step input');
  var progress = document.getElementById('progress');
  var ptext = document.getElementById('progress-text');

  function update() {
    var n = Array.prototype.filter.call(boxes, function (b) { return b.checked; }).length;
    progress.value = n;
    ptext.textContent = n + ' of 3 complete';
  }
  boxes.forEach(function (b) { b.addEventListener('change', update); });

  document.getElementById('create').addEventListener('click', function () {
    status.textContent = 'Opening the new project form…';
  });
  var file = document.getElementById('csv');
  document.getElementById('import').addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () {
    if (file.files && file.files[0]) status.textContent = 'Selected “' + file.files[0].name + '”. Ready to import.';
  });
  update();
})();
</script>
</body>
</html>
