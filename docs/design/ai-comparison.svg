    <text x="370" y="596">– / –</text><text x="520" y="596">– / –</text><text x="670" y="596">– / –</text><text x="820" y="596">– / –</text><text x="970" y="596">– / –</text><text x="1166" y="596">– / –</text>
    <text x="370" y="624">– / –</text><text x="520" y="624">– / –</text><text x="670" y="624">– / –</text><text x="820" y="624">– / –</text><text x="970" y="624">– / –</text><text x="1166" y="624">– / –</text>
    <text x="370" y="652">– / –</text><text x="520" y="652">– / –</text><text x="670" y="652">– / –</text><text x="820" y="652">– / –</text><text x="970" y="652">– / –</text><text x="1166" y="652">– / –</text>
    <text x="370" y="680">– / –</text><text x="520" y="680">– / –</text><text x="670" y="680">– / –</text><text x="820" y="680">– / –</text><text x="970" y="680">– / –</text><text x="1166" y="680">– / –</text>
    <text x="370" y="708">– / –</text><text x="520" y="708">– / –</text><text x="670" y="708">– / –</text><text x="820" y="708">– / –</text><text x="970" y="708">– / –</text><text x="1166" y="708">– / –</text>
    <text x="370" y="736">– / –</text><text x="520" y="736">– / –</text><text x="670" y="736">– / –</text><text x="820" y="736">– / –</text><text x="970" y="736">– / –</text><text x="1166" y="736">– / –</text>
  </g>
  <text x="90" y="770" font-size="12" fill="#71717a">“–” = measured value goes here. Row 10 (Delete with confirm) continues below the fold. Differences are set in bold; no colors mark better or worse.</text>

  <!-- 4 per-screen section -->
  <text x="90" y="826" font-size="12" fill="#52525b" font-family="'Space Mono', ui-monospace, monospace">01</text>
  <text x="122" y="828" font-size="22" font-weight="650" fill="#18181b">Sign in</text>
  <!-- tabs light/dark -->
  <rect x="1046" y="806" width="144" height="32" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/>
  <rect x="1050" y="810" width="68" height="24" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="1084" y="826" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">Light</text>
  <text x="1152" y="826" font-size="12" fill="#52525b" text-anchor="middle">Dark</text>

  <!-- A shot -->
