<div style="display:grid;gap:var(--k-space-4);max-width:420px;width:100%">
  <div style="display:grid;gap:var(--k-space-2)">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span style="font-weight:550">Uploading footage</span><span style="font-family:var(--k-mono);color:var(--k-ink-2)">68%</span></div>
    <div class="k-progress" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100"><div class="k-progress-bar" style="width:68%"></div></div>
  </div>
  <div style="display:grid;gap:var(--k-space-2)">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span style="font-weight:550">Verifying files</span><span style="font-family:var(--k-mono);color:var(--k-ink-2)">92%</span></div>
    <div class="k-progress" data-tone="accent" role="progressbar" aria-valuenow="92" aria-valuemin="0" aria-valuemax="100"><div class="k-progress-bar" style="width:92%"></div></div>
  </div>
</div>
