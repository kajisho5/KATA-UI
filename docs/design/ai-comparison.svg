<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" viewBox="0 0 1280 1640" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <title>Ten screens, two ways: page design</title>
  <rect width="1280" height="1640" fill="#fafafa"/>

  <!-- site header (existing chrome) -->
  <line x1="0" x2="1280" y1="58" y2="58" stroke="#e4e4e7"/>
  <rect x="92" y="22" width="16" height="16" fill="#18181b"/><rect x="100" y="30" width="8" height="8" fill="#e83a1f"/>
  <text x="118" y="35" font-size="14" font-weight="600" fill="#18181b">KATA UI</text>
  <text x="290" y="35" font-size="13" fill="#3f3f46">Docs    Components    Blocks    Templates    Icons    Themes    Design System    Pricing</text>
  <rect x="893" y="13" width="122" height="32" rx="7" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="925" y="34" font-size="13" fill="#a1a1aa">Search  ⌘K</text>

  <!-- 1 title -->
  <text x="90" y="128" font-size="12" fill="#52525b" font-family="'Space Mono', ui-monospace, monospace">COMPARISON · 10 SCREENS · GENERATED 2026-11-07</text>
  <text x="90" y="176" font-size="40" font-weight="700" fill="#18181b" letter-spacing="-1">Ten screens, two ways</text>
  <text x="90" y="210" font-size="15" fill="#3f3f46">One prompt per screen. A: the prompt alone. B: the same prompt, assembled from parts fetched from the KATA registry.</text>

  <!-- 2 method box -->
  <rect x="90" y="236" width="1100" height="128" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="114" y="266" font-size="13" font-weight="650" fill="#18181b">Method</text>
  <g font-size="13" fill="#3f3f46">
    <text x="114" y="292">· Agent: Claude (Anthropic) via Claude Code, both drafts on the same day.</text>
    <text x="114" y="314">· First output kept for every draft: no retries, no picking, no hand edits.</text>
    <text x="114" y="336">· B adds one fixed sentence to the prompt: “Fetch each part from kata-ui.dev/registry.json and use it unmodified.”</text>
  </g>
  <text x="1166" y="292" font-size="13" fill="#18181b" text-anchor="end" text-decoration="underline">Prompts and raw HTML</text>
  <text x="1166" y="314" font-size="13" fill="#18181b" text-anchor="end" text-decoration="underline">Measurement script</text>

  <!-- 3 summary table -->
  <text x="90" y="414" font-size="22" font-weight="650" fill="#18181b">Summary</text>
  <rect x="90" y="430" width="1100" height="318" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-size="12" font-weight="600" fill="#52525b">
    <text x="114" y="458">Screen</text>
    <text x="370" y="458" text-anchor="end">Focus hidden</text>
    <text x="370" y="474" text-anchor="end" font-weight="400" fill="#71717a">A / B</text>
    <text x="520" y="458" text-anchor="end">Unnamed controls</text>
    <text x="520" y="474" text-anchor="end" font-weight="400" fill="#71717a">A / B</text>
    <text x="670" y="458" text-anchor="end">Contrast &lt; 4.5</text>
    <text x="670" y="474" text-anchor="end" font-weight="400" fill="#71717a">A / B</text>
    <text x="820" y="458" text-anchor="end">Colors used</text>
    <text x="820" y="474" text-anchor="end" font-weight="400" fill="#71717a">A / B</text>
    <text x="970" y="458" text-anchor="end">Dark + RTL breaks</text>
    <text x="970" y="474" text-anchor="end" font-weight="400" fill="#71717a">A / B</text>
    <text x="1166" y="458" text-anchor="end">Console errors</text>
    <text x="1166" y="474" text-anchor="end" font-weight="400" fill="#71717a">A / B</text>
  </g>
  <line x1="90" x2="1190" y1="486" y2="486" stroke="#e4e4e7"/>
  <g font-size="13" fill="#18181b">
    <text x="114" y="512">1  Sign in</text>
