<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Create your account · Tallyboard</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --text: #1a1d23; --muted: #5b6270;
    --border: #cfd4dc; --primary: #3b4fd8; --primary-hover: #2f40b8; --primary-text: #fff;
    --danger: #b42318; --ok: #067647; --focus: #3b4fd8; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #181b21; --text: #e8eaee; --muted: #a3aab6;
      --border: #3a3f4a; --primary: #8a9bff; --primary-hover: #a6b3ff; --primary-text: #0f1115;
      --danger: #ff8a80; --ok: #6ce9a6; --focus: #a6b3ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 440px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.125rem; margin-bottom: 20px; }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: var(--primary-text); display: grid; place-items: center; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  .req { color: var(--danger); }
  input[type="text"], input[type="email"], input[type="password"], select {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  }
  select { appearance: auto; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  [aria-invalid="true"] { border-color: var(--danger) !important; }
  .hint { margin: 6px 0 0; padding: 0; list-style: none; font-size: .85rem; color: var(--muted); }
  .hint li { display: flex; align-items: center; gap: 6px; }
  .hint li::before { content: "○"; width: 1em; text-align: center; }
  .hint li.met { color: var(--ok); }
  .hint li.met::before { content: "✓"; }
  .error { color: var(--danger); font-size: .85rem; margin: 6px 0 0; }
  .error:empty { display: none; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: .9rem; margin: 0; }
  .check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--primary); }
  a { color: var(--primary); font-weight: 600; }
  .primary {
    width: 100%; padding: 12px 16px; font: inherit; font-weight: 600; border: 0;
    border-radius: var(--radius); background: var(--primary); color: var(--primary-text); cursor: pointer;
  }
  .primary:hover { background: var(--primary-hover); }
  .foot { text-align: center; color: var(--muted); font-size: .9rem; margin: 20px 0 0; }
  .success {
    border: 1px solid var(--ok); color: var(--ok); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 18px; font-weight: 600;
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="logo" aria-hidden="true">T</span>Tallyboard</div>
  <h1>Create your account</h1>
  <p class="sub">Start organizing your team's work in minutes.</p>

  <div id="success" class="success" role="status" hidden>Account created. Check your inbox to verify your email.</div>

  <form id="signup" novalidate>
    <div class="field">
      <label for="name">Full name <span class="req" aria-hidden="true">*</span></label>
      <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-err">
      <p class="error" id="name-err"></p>
    </div>

    <div class="field">
      <label for="email">Work email <span class="req" aria-hidden="true">*</span></label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-err" placeholder="you@company.com">
      <p class="error" id="email-err"></p>
    </div>

    <div class="field">
      <label for="password">Password <span class="req" aria-hidden="true">*</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="pw-hint pw-err">
      <ul class="hint" id="pw-hint" aria-label="Password requirements">
        <li data-rule="len">At least 8 characters</li>
        <li data-rule="num">At least one number</li>
        <li data-rule="case">Upper- and lowercase letters</li>
      </ul>
      <p class="error" id="pw-err"></p>
    </div>

    <div class="field">
      <label for="size">Company size <span class="req" aria-hidden="true">*</span></label>
      <select id="size" name="size" required aria-describedby="size-err">
        <option value="">Select company size</option>
        <option value="1-10">1–10</option>
        <option value="11-50">11–50</option>
        <option value="51-200">51–200</option>
        <option value="201+">201+</option>
      </select>
      <p class="error" id="size-err"></p>
    </div>

    <div class="field">
      <label class="check" for="terms">
        <input id="terms" name="terms" type="checkbox" required aria-describedby="terms-err">
        <span>I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>. <span class="req" aria-hidden="true">*</span></span>
      </label>
      <p class="error" id="terms-err"></p>
    </div>

    <button type="submit" class="primary">Create account</button>
  </form>
  <p class="foot">Already have an account? <a href="#signin">Sign in</a></p>
</main>

<script>
(function () {
  var form = document.getElementById('signup');
  var pw = document.getElementById('password');
  var rules = {
    len: function (v) { return v.length >= 8; },
    num: function (v) { return /\d/.test(v); },
    "case": function (v) { return /[a-z]/.test(v) && /[A-Z]/.test(v); }
  };
  function pwOk() {
    var ok = true;
    document.querySelectorAll('#pw-hint li').forEach(function (li) {
      var met = rules[li.dataset.rule](pw.value);
      li.classList.toggle('met', met);
      ok = ok && met;
    });
    return ok;
  }
  pw.addEventListener('input', pwOk);

  function setErr(input, errId, msg) {
    document.getElementById(errId).textContent = msg;
    if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    return !msg;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name');
    var email = document.getElementById('email');
    var size = document.getElementById('size');
    var terms = document.getElementById('terms');
    var results = [
      [name, setErr(name, 'name-err', name.value.trim() ? '' : 'Enter your full name.')],
      [email, setErr(email, 'email-err', email.value && email.checkValidity() ? '' : 'Enter a valid work email.')],
      [pw, setErr(pw, 'pw-err', pwOk() ? '' : 'Password does not meet all the requirements.')],
      [size, setErr(size, 'size-err', size.value ? '' : 'Select your company size.')],
      [terms, setErr(terms, 'terms-err', terms.checked ? '' : 'You must accept the terms to continue.')]
    ];
    var firstBad = results.find(function (r) { return !r[1]; });
    if (firstBad) { firstBad[0].focus(); return; }
    var s = document.getElementById('success');
    s.hidden = false;
    form.reset(); pwOk();
    s.setAttribute('tabindex', '-1'); s.focus();
  });
})();
</script>
</body>
</html>
