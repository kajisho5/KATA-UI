<button class="btn btn-danger btn-md" data-alert-open>Delete project</button>
<dialog class="kalert" data-alert-dialog role="alertdialog" aria-label="Delete project">
  <div class="kalert-in">
    <h3>Delete this project?</h3>
    <p>The project and all of its files will be permanently deleted. This cannot be undone, and shared links stop working immediately.</p>
    <div class="kalert-row">
      <button class="btn btn-sec btn-md" data-alert-close>Keep project</button>
      <button class="btn btn-danger btn-md" data-alert-close>Delete project</button>
    </div>
  </div>
</dialog>
