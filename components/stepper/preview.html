<div style="display:flex;gap:26px;flex-wrap:wrap;align-items:center">
  <label style="display:grid;gap:6px;font-size:12.5px;font-weight:550">Seats
    <span class="k-stepper" data-stepper data-min="1" data-max="8">
      <button type="button" data-step-btn="-1" aria-label="Decrease seats">−</button>
      <output data-step-val aria-live="polite">2</output>
      <button type="button" data-step-btn="1" aria-label="Increase seats">+</button>
    </span>
  </label>
  <label style="display:grid;gap:6px;font-size:12.5px;font-weight:550">Copies
    <span class="k-stepper" data-stepper data-min="1" data-max="5">
      <button type="button" data-step-btn="-1" aria-label="Decrease copies">−</button>
      <output data-step-val aria-live="polite">5</output>
      <button type="button" data-step-btn="1" aria-label="Increase copies">+</button>
    </span>
  </label>
</div>
