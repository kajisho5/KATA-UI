<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in · Tallyboard</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1a1d23;
    --muted: #5b6270;
    --border: #cfd4dc;
    --primary: #3b4fd8;
    --primary-hover: #2f40b8;
    --primary-text: #ffffff;
    --danger: #b42318;
    --danger-bg: #fef3f2;
    --focus: #3b4fd8;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #181b21;
      --text: #e8eaee;
      --muted: #a3aab6;
      --border: #3a3f4a;
      --primary: #8a9bff;
      --primary-hover: #a6b3ff;
      --primary-text: #0f1115;
      --danger: #ff8a80;
      --danger-bg: #2a1614;
      --focus: #a6b3ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 1.125rem; margin-bottom: 24px;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--primary); color: var(--primary-text);
    display: grid; place-items: center; font-size: .95rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-inline-end: 64px; }
  .toggle {
    position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--primary);
    font: inherit; font-size: .85rem; font-weight: 600;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
  }
  .error {
    display: flex; gap: 6px; align-items: flex-start;
    margin-top: 6px; color: var(--danger); font-size: .875rem;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; margin-bottom: 22px;
  }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 0; font-size: .9rem; }
  .check input { width: 18px; height: 18px; accent-color: var(--primary); margin: 0; }
  a { color: var(--primary); font-weight: 600; text-underline-offset: 2px; }
  a:hover { color: var(--primary-hover); }
  .primary {
    width: 100%;
    padding: 12px 16px;
    font: inherit; font-weight: 600;
    border: 0; border-radius: var(--radius);
    background: var(--primary); color: var(--primary-text);
    cursor: pointer;
  }
  .primary:hover { background: var(--primary-hover); }
  .primary:disabled { opacity: .6; cursor: progress; }
  .foot { text-align: center; margin: 22px 0 0; color: var(--muted); font-size: .9rem; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .primary, input { transition: background-color .15s, border-color .15s; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="logo" aria-hidden="true">T</span>Tallyboard</div>
    <h1>Sign in</h1>
    <p class="sub">Welcome back. Sign in to see your boards.</p>

    <form id="signin" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required value="maya.chen@example.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 aria-invalid="true" aria-describedby="password-error" value="wrongpass">
          <button type="button" class="toggle" id="toggle-pw" aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <p class="error" id="password-error" role="alert">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex:none;margin-top:3px"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5v4.2M8 10.8v.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Incorrect password.</span>
        </p>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" name="remember" id="remember"> Remember me</label>
        <a href="#forgot">Forgot password?</a>
      </div>

      <button type="submit" class="primary" id="submit">Sign in</button>
    </form>

    <p class="foot">New to Tallyboard? <a href="#signup">Create an account</a></p>
    <p class="sr-only" aria-live="polite" id="status"></p>
  </main>

<script>
(function () {
  var pw = document.getElementById('password');
  var toggle = document.getElementById('toggle-pw');
  var err = document.getElementById('password-error');
  var form = document.getElementById('signin');
  var status = document.getElementById('status');

  toggle.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  toggle.setAttribute('aria-label', 'Show password');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email');
    if (!email.value || !email.checkValidity()) {
      email.setAttribute('aria-invalid', 'true');
      email.focus();
      status.textContent = 'Enter a valid email address.';
      return;
    }
    email.removeAttribute('aria-invalid');
    // Demo: any password other than "correct-horse" is rejected.
    if (pw.value !== 'correct-horse') {
      pw.setAttribute('aria-invalid', 'true');
      err.hidden = false;
      err.querySelector('span').textContent = 'Incorrect password.';
      pw.focus();
      pw.select();
    } else {
      pw.removeAttribute('aria-invalid');
      err.hidden = true;
      status.textContent = 'Signed in.';
    }
  });
})();
</script>
</body>
</html>
