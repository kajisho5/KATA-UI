<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../logo/favicon.svg"><title>skeleton multi-instance</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/skeleton/skeleton.css"><style>body{font-family:var(--k-font);background:var(--k-bg);color:var(--k-ink);padding:var(--k-space-8)}section{margin-block:var(--k-space-6)}</style></head><body><h1>skeleton — three sets</h1><section><h2>Set 1</h2><div role="status" style="display:grid;gap:var(--k-space-3);max-width:380px;width:100%">

  <span class="k-sk" style="height:64px;border-radius:var(--k-radius-lg)"></span>
  </div>
</div>
</section><section><h2>Set 2</h2><div role="status" style="display:grid;gap:var(--k-space-3);max-width:380px;width:100%">
