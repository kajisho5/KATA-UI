  <rect x="650" y="852" width="540" height="34" rx="12" fill="#f4f4f5"/>
  <text x="668" y="874" font-size="12" font-weight="650" fill="#18181b">B · Assembled from KATA parts</text>
  <text x="1172" y="874" font-size="12" fill="#18181b" text-anchor="end" text-decoration="underline">kata.html</text>
  <g>
    <rect x="805" y="920" width="230" height="260" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="830" y="944" width="110" height="14" rx="3" fill="#18181b"/>
    <rect x="830" y="976" width="60" height="8" rx="2" fill="#71717a"/><rect x="830" y="990" width="180" height="30" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
    <rect x="830" y="1032" width="70" height="8" rx="2" fill="#71717a"/><rect x="830" y="1046" width="180" height="30" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
