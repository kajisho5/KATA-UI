<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KATA UI — OGP card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #09090b; color: #fafafa; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; padding: 84px; gap: 72px; }
  .mark { flex: none; }
  h1 { font-size: 96px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .tag { margin-top: 26px; font-size: 40px; font-weight: 500; letter-spacing: -.015em; color: #d4d4d8; line-height: 1.3; }
  .sub { margin-top: 20px; font-size: 25px; line-height: 1.55; color: #a1a1aa; max-width: 600px; }
  .url { margin-top: 34px; font-family: "Geist Mono", monospace; font-size: 22px; color: #71717a; }
  .url b { color: #eb471f; font-weight: 500; }
</style>
</head>
<body>
  <svg class="mark" width="330" height="330" viewBox="0 0 48 48" aria-hidden="true">
    <rect x="9" y="9" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="3.4"/>
    <path d="M14.5 33.5 L33.5 14.5" stroke="#ffffff" stroke-width="3.4" stroke-linecap="square"/>
    <circle cx="24" cy="24" r="4.6" fill="#eb471f"/>
  </svg>
  <div>
    <h1>KATA UI</h1>
    <p class="tag">Parts, cast from a single mold.</p>
    <p class="sub">Vanilla UI components — copy-paste, CLI &amp; registry. No framework, no build step.</p>
    <p class="url">kata-ui<b>.</b>dev</p>
  </div>
</body>
</html>
