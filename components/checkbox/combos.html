<!-- parts: button -->
<!-- combo: Consent, then continue -->
<!-- note: Checkboxes carry the agreement; the Button carries the consequence. Kept in one column at one rhythm, the legal part of the page stops feeling bolted on. -->
<div style="display:grid;gap:11px;max-width:440px;width:100%">
  <label class="check"><input type="checkbox" checked>Send the estimate when it is ready</label>
  <label class="check"><input type="checkbox">Include travel costs in the total</label>
  <label class="check"><input type="checkbox">Share a read-only link with the client</label>
  <div style="margin-top:5px"><button class="btn btn-pri btn-md" type="button">Continue</button></div>
</div>
