<div class="k-dr" data-dr data-dr-gap="50">
  <div class="k-dr-track">
    <span class="k-dr-fill"></span>
    <input type="range" min="0" max="1000" step="10" value="150" data-dr-lo aria-label="Minimum price">
    <input type="range" min="0" max="1000" step="10" value="720" data-dr-hi aria-label="Maximum price">
  </div>
  <div class="k-dr-out"><span>From <output data-dr-out-lo>$150</output></span><span>To <output data-dr-out-hi>$720</output></span></div>
</div>
