    <rect x="16" y="526" width="190" height="10" rx="2" fill="#18181b"/>
    <rect x="16" y="542" width="180" height="5" rx="2" fill="#a1a1aa"/><rect x="16" y="552" width="120" height="5" rx="2" fill="#a1a1aa"/>
