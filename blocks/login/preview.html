<div class="login-card">
  <div class="login-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><rect x="10" y="10" width="4" height="4" rx="1.2"/></svg></div>
  <h3 class="login-h">Welcome back</h3>
  <p class="login-sub">Sign in to your workspace.</p>
  <div class="field"><label for="li-email">Email</label><input class="input" id="li-email" type="email" placeholder="you@example.com"></div>
  <div class="field"><label for="li-pass">Password</label><input class="input" id="li-pass" type="password" placeholder="Your password"></div>
  <div class="login-row">
    <label class="check"><input type="checkbox" checked>Remember me</label>
    <a class="login-link" href="#">Forgot password?</a>
  </div>
  <button class="btn btn-pri btn-lg login-cta">Sign in</button>
  <div class="k-sep-label">OR</div>
  <button class="btn btn-sec btn-lg login-cta">Continue with SSO</button>
  <p class="login-foot">No account? <a href="#">Create one</a></p>
</div>

<link rel="stylesheet" href="/components/button/button.css">
<link rel="stylesheet" href="/components/checkbox/checkbox.css">
