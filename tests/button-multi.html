<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — three instances</title><link rel="icon" href="../logo/favicon.svg"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/button/button.css"><style>body{margin:var(--k-space-6);font-family:var(--k-font);background:var(--k-bg);color:var(--k-ink)}main{display:grid;gap:var(--k-space-6)}section{display:flex;flex-wrap:wrap;gap:var(--k-space-2)}</style></head><body><h1>Button: three sets and RTL</h1><main><section aria-label="Button set 1"><button type="button" class="btn btn-pri btn-md">Primary</button>
<button type="button" class="btn btn-sec btn-md">Secondary</button>
<button type="button" class="btn btn-ghost btn-md">Ghost</button>
<button type="button" class="btn btn-accent btn-md">Accent</button>
<button type="button" class="btn btn-danger btn-md">Delete</button>
<button type="button" class="btn btn-pri btn-md" disabled>Disabled</button>
<button type="button" class="btn btn-pri btn-md" disabled aria-busy="true"><span class="spin" aria-hidden="true"></span>Saving…</button>
<button type="button" class="btn btn-sec btn-sm">Small</button>
<button type="button" class="btn btn-pri btn-lg">Large</button>
</section><section aria-label="Button set 2"><button type="button" class="btn btn-pri btn-md">Primary</button>
<button type="button" class="btn btn-sec btn-md">Secondary</button>
<button type="button" class="btn btn-ghost btn-md">Ghost</button>
<button type="button" class="btn btn-accent btn-md">Accent</button>
<button type="button" class="btn btn-danger btn-md">Delete</button>
<button type="button" class="btn btn-pri btn-md" disabled>Disabled</button>
<button type="button" class="btn btn-pri btn-md" disabled aria-busy="true"><span class="spin" aria-hidden="true"></span>Saving…</button>
<button type="button" class="btn btn-sec btn-sm">Small</button>
<button type="button" class="btn btn-pri btn-lg">Large</button>
</section><section dir="rtl" aria-label="Button set 3"><button type="button" class="btn btn-pri btn-md">Primary</button>
<button type="button" class="btn btn-sec btn-md">Secondary</button>
<button type="button" class="btn btn-ghost btn-md">Ghost</button>
<button type="button" class="btn btn-accent btn-md">Accent</button>
<button type="button" class="btn btn-danger btn-md">Delete</button>
<button type="button" class="btn btn-pri btn-md" disabled>Disabled</button>
<button type="button" class="btn btn-pri btn-md" disabled aria-busy="true"><span class="spin" aria-hidden="true"></span>Saving…</button>
<button type="button" class="btn btn-sec btn-sm">Small</button>
<button type="button" class="btn btn-pri btn-lg">Large</button>
</section></main></body></html>
