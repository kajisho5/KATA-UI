<div class="k-split" data-split style="max-width:600px">
  <div class="k-split-a">
    <h5>Notebooks</h5>
    <div class="row on">Product notes</div>
    <div class="row">Meeting log</div>
    <div class="row">Reading list</div>
    <div class="row">Archive</div>
  </div>
  <div class="k-split-h" data-split-h tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize panes" aria-valuenow="38" aria-valuemin="20" aria-valuemax="80"><span class="dots"></span></div>
  <div class="k-split-b">
    <h5>Product notes</h5>
    <p>The left pane is a list, the right pane is the thing itself. Drag the handle — or focus it and use the arrow keys — and the split holds anywhere between 20% and 80%.</p>
  </div>
</div>
