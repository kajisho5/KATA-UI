  <!-- ===== AFTER (detailed, 0.55 scale of a 1280px page; content column 1040px -> 572px) ===== -->
  <g transform="translate(560,64)">
    <rect width="680" height="1380" rx="12" fill="#fafafa" stroke="#e4e4e7"/>
    <!-- header (unchanged) -->
    <rect x="0" y="0" width="680" height="40" rx="12" fill="#fafafa"/>
    <line x1="0" x2="680" y1="40" y2="40" stroke="#e4e4e7"/>
    <rect x="24" y="14" width="12" height="12" fill="#18181b"/>
    <text x="42" y="25" font-size="11" font-weight="600" fill="#18181b">KATA UI</text>
    <text x="110" y="25" font-size="9.5" fill="#3f3f46">Docs   Components   Blocks   Templates   Icons   Themes   Design System   Pricing</text>
    <rect x="520" y="12" width="96" height="16" rx="4" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="532" y="23" font-size="8.5" fill="#a1a1aa">Search ⌘K</text>
    <text x="664" y="25" font-size="8" fill="#a1a1aa" text-anchor="end">変更なし</text>

    <!-- 1 Hero -->
    <text x="340" y="88" font-size="9" fill="#52525b" text-anchor="middle" font-family="'Space Mono', ui-monospace, monospace">136 components (<tspan text-decoration="underline">1 stable</tspan> · <tspan text-decoration="underline">135 beta</tspan>) · 21 blocks · 7 templates</text>
    <text x="340" y="132" font-size="34" font-weight="700" fill="#18181b" text-anchor="middle" letter-spacing="-0.8">HTML, CSS and JavaScript</text>
    <text x="340" y="170" font-size="34" font-weight="700" fill="#52525b" text-anchor="middle" letter-spacing="-0.8">for the page you're building.</text>
    <text x="340" y="204" font-size="12" fill="#3f3f46" text-anchor="middle">Copy the files into your project. No framework, no build step.</text>
    <rect x="236" y="222" width="112" height="30" rx="6" fill="#18181b"/>
    <text x="292" y="241" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">Browse components</text>
    <text x="398" y="241" font-size="10.5" fill="#18181b" text-anchor="middle">Get started</text>
    <text x="340" y="276" font-size="9" fill="#71717a" text-anchor="middle">MIT · <tspan text-decoration="underline">Mold Verified 164 / 164</tspan> · <tspan text-decoration="underline">Results</tspan></text>
    <text x="664" y="204" font-size="10" fill="#15803d" text-anchor="end">47語</text>

    <!-- 2 One mold -->
    <text x="54" y="330" font-size="17" font-weight="650" fill="#18181b">One mold: shared tokens</text>
    <text x="54" y="352" font-size="11" fill="#3f3f46">Load tokens.css, then a component. Change a token; every part follows.</text>
    <text x="664" y="330" font-size="10" fill="#15803d" text-anchor="end">16語</text>

    <!-- 3 Five to start -->
    <text x="54" y="406" font-size="17" font-weight="650" fill="#18181b">Five to start</text>
    <g font-size="11" font-weight="600" fill="#18181b">
      <rect x="54" y="422" width="106" height="44" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="66" y="448">Button</text>
      <rect x="108" y="438" width="44" height="14" rx="7" fill="#d1fae5"/><text x="130" y="448" font-size="7.5" fill="#047857" text-anchor="middle">STABLE</text>
      <rect x="168" y="422" width="106" height="44" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="180" y="448">Input</text>
      <rect x="226" y="438" width="36" height="14" rx="7" fill="#fef3c7"/><text x="244" y="448" font-size="7.5" fill="#b45309" text-anchor="middle">BETA</text>
      <rect x="282" y="422" width="106" height="44" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="294" y="448">Badge</text>
      <rect x="340" y="438" width="36" height="14" rx="7" fill="#fef3c7"/><text x="358" y="448" font-size="7.5" fill="#b45309" text-anchor="middle">BETA</text>
      <rect x="396" y="422" width="106" height="44" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="408" y="448">Tabs</text>
      <rect x="454" y="438" width="36" height="14" rx="7" fill="#fef3c7"/><text x="472" y="448" font-size="7.5" fill="#b45309" text-anchor="middle">BETA</text>
      <rect x="510" y="422" width="106" height="44" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="522" y="448">Toast</text>
      <rect x="568" y="438" width="36" height="14" rx="7" fill="#fef3c7"/><text x="586" y="448" font-size="7.5" fill="#b45309" text-anchor="middle">BETA</text>
    </g>
    <text x="54" y="484" font-size="9" fill="#71717a">カード：部品名＋状態バッジだけ。説明文とタグは消す。各カードは部品ページへのリンク（今と同じ）。</text>
    <text x="664" y="406" font-size="10" fill="#15803d" text-anchor="end">13語</text>

    <!-- 4 Install -->
    <text x="54" y="536" font-size="17" font-weight="650" fill="#18181b">Install</text>
    <rect x="54" y="548" width="562" height="44" rx="6" fill="#f4f4f5" stroke="#e4e4e7"/>
    <text x="66" y="566" font-size="9.5" fill="#18181b" font-family="'Space Mono', ui-monospace, monospace">npx @kajisho5/kataui init</text>
    <text x="66" y="582" font-size="9.5" fill="#18181b" font-family="'Space Mono', ui-monospace, monospace">npx @kajisho5/kataui add button</text>
    <text x="54" y="612" font-size="11" fill="#3f3f46">Or copy from any component page.</text>
    <text x="664" y="536" font-size="10" fill="#15803d" text-anchor="end">14語</text>

    <!-- 5 Templates -->
    <text x="54" y="664" font-size="17" font-weight="650" fill="#18181b">Templates</text>
    <text x="54" y="686" font-size="11" fill="#3f3f46">Try a <tspan text-decoration="underline">dashboard</tspan>, <tspan text-decoration="underline">inbox</tspan> or <tspan text-decoration="underline">settings page</tspan>.</text>
    <text x="664" y="664" font-size="10" fill="#15803d" text-anchor="end">8語</text>

    <!-- 6 AI tools -->
    <text x="54" y="738" font-size="17" font-weight="650" fill="#18181b">AI tools</text>
    <text x="54" y="760" font-size="11" fill="#3f3f46">The <tspan text-decoration="underline">registry</tspan>, <tspan text-decoration="underline">MCP server</tspan> and <tspan text-decoration="underline">AI skill</tspan> serve the files you copy here.</text>
    <text x="54" y="778" font-size="11" fill="#3f3f46">Works with any HTML stack; React needs <tspan text-decoration="underline">a few markup changes</tspan>.</text>
    <text x="664" y="738" font-size="10" fill="#15803d" text-anchor="end">26語</text>

    <!-- 7 Pro -->
    <text x="54" y="830" font-size="17" font-weight="650" fill="#18181b">Components are free. Pro adds layouts.</text>
    <text x="54" y="852" font-size="11" fill="#3f3f46">21 blocks, 7 templates, $129 once. Not on sale yet. <tspan text-decoration="underline" fill="#18181b">Pricing</tspan></text>
    <text x="664" y="830" font-size="10" fill="#15803d" text-anchor="end">17語</text>

    <!-- 8 More -->
    <text x="54" y="904" font-size="11" fill="#3f3f46">More: <tspan text-decoration="underline">Lab</tspan> · <tspan text-decoration="underline">Showcase</tspan> · <tspan text-decoration="underline">Report a problem</tspan></text>
    <text x="664" y="904" font-size="10" fill="#15803d" text-anchor="end">8語</text>

    <!-- footer (unchanged) -->
    <line x1="54" x2="616" y1="944" y2="944" stroke="#e4e4e7"/>
    <text x="54" y="964" font-size="9" fill="#71717a">KATA UI   <tspan text-decoration="underline">Mold Verified 164 / 164 · UI 121 / 121 · Lab 43 / 43</tspan>   Docs   Lab   GitHub</text>
    <text x="664" y="964" font-size="8" fill="#a1a1aa" text-anchor="end">変更なし</text>

    <!-- Foundry pill (unchanged) -->
    <rect x="590" y="420" width="78" height="22" rx="11" fill="#18181b"/>
    <circle cx="604" cy="431" r="3.5" fill="#e83a1f"/>
    <text x="614" y="435" font-size="9" font-weight="600" fill="#ffffff">Foundry</text>

    <!-- notes -->
    <rect x="24" y="1010" width="632" height="340" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="44" y="1040" font-size="13" font-weight="700" fill="#18181b">変えないもの</text>
    <text x="44" y="1064" font-size="11" fill="#3f3f46">・上のメニュー、左の部品一覧、テーマ編集パネル（Foundry）、フッター</text>
    <text x="44" y="1084" font-size="11" fill="#3f3f46">・色、余白、文字の大きさ、カードの枠（site.css の今の書き方を使う）</text>
    <text x="44" y="1104" font-size="11" fill="#3f3f46">・部品数と Mold Verified の数字は、生成時に数えた値を出す</text>
    <text x="44" y="1140" font-size="13" font-weight="700" fill="#18181b">消す文の行き先</text>
    <text x="44" y="1164" font-size="11" fill="#3f3f46">・5部品の説明文とタグ → 各部品ページにある</text>
    <text x="44" y="1184" font-size="11" fill="#3f3f46">・対応する環境の一覧（Astro, Laravel …）→ Docs の Installation にある</text>
    <text x="44" y="1204" font-size="11" fill="#3f3f46">・UI 121 / 121 · Lab 43 / 43 の内訳 → フッターと結果ページにある</text>
    <text x="44" y="1240" font-size="13" font-weight="700" fill="#18181b">数え方</text>
    <text x="44" y="1264" font-size="11" fill="#3f3f46">本文（ヒーロー〜最後の節）の文字を空白で区切って数える。script / style は除く。</text>
    <text x="44" y="1284" font-size="11" fill="#3f3f46">今 369語 → 目標 185語以下。CI のテストで毎回確かめる。</text>
    <text x="44" y="1320" font-size="10" fill="#71717a">幅390px（スマホ）では、カード5枚が2列に折り返す（今と同じ並び方）。</text>
  </g>
</svg>
