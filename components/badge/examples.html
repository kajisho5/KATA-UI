<!-- example: Tones -->
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <span class="badge">Draft</span>
  <span class="badge teal">Active</span>
  <span class="badge amber">Pending</span>
  <span class="badge red">Overdue</span>
  <span class="badge dark">Archived</span>
</div>
<!-- example: With dot -->
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <span class="badge teal"><i></i>All systems live</span>
  <span class="badge amber"><i></i>Degraded</span>
  <span class="badge red"><i></i>Outage</span>
</div>
<!-- example: In a list row -->
<div style="display:grid;gap:10px;max-width:380px">
  <div style="display:flex;align-items:center;gap:10px;font-size:13.5px"><span style="flex:1">q3-board-deck.pdf</span><span class="badge teal">Paid</span></div>
  <div style="display:flex;align-items:center;gap:10px;font-size:13.5px"><span style="flex:1">venue-invoice.pdf</span><span class="badge amber">Due in 3 days</span></div>
  <div style="display:flex;align-items:center;gap:10px;font-size:13.5px"><span style="flex:1">travel-receipts.zip</span><span class="badge">Draft</span></div>
</div>
