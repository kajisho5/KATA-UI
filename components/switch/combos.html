<!-- parts: badge, card -->
<!-- combo: Feature flags, on a card -->
<!-- note: Switches report state; Badges name it. On a Card the three rows become one settings surface — the pattern behind most admin pages. -->
<div class="k-card" style="max-width:460px;width:100%">
  <div class="k-card-h"><div><h3>Feature flags</h3><p>Rollouts for this workspace.</p></div></div>
  <div class="k-card-b" style="display:grid;gap:var(--k-space-3)">
    <div style="display:flex;align-items:center;gap:var(--k-space-2)"><label class="switchrow"><span class="switch asagi"><input role="switch" type="checkbox" checked><span class="tr"></span></span>New editor</label><span style="margin-left:auto"><span class="badge asagi"><i></i>Live</span></span></div>
    <div style="display:flex;align-items:center;gap:var(--k-space-2)"><label class="switchrow"><span class="switch asagi"><input role="switch" type="checkbox" checked><span class="tr"></span></span>Inline comments</label><span style="margin-left:auto"><span class="badge yamabuki"><i></i>Beta</span></span></div>
    <div style="display:flex;align-items:center;gap:var(--k-space-2)"><label class="switchrow"><span class="switch"><input role="switch" type="checkbox"><span class="tr"></span></span>Public API v2</label><span style="margin-left:auto"><span class="badge">Off</span></span></div>
  </div>
</div>
