<!-- example: Variants -->
<div style="display:flex;gap:var(--k-space-2);flex-wrap:wrap;align-items:center">
  <button type="button" class="btn btn-pri btn-md">Primary</button>
  <button type="button" class="btn btn-sec btn-md">Secondary</button>
  <button type="button" class="btn btn-accent btn-md">Accent</button>
  <button type="button" class="btn btn-danger btn-md">Delete</button>
  <button type="button" class="btn btn-ghost btn-md">Ghost</button>
</div>
<!-- example: Sizes -->
<div style="display:flex;gap:var(--k-space-2);flex-wrap:wrap;align-items:center">
  <button type="button" class="btn btn-pri btn-sm">Small</button>
  <button type="button" class="btn btn-pri btn-md">Medium</button>
  <button type="button" class="btn btn-pri btn-lg">Large</button>
  <button type="button" class="btn btn-sec btn-lg">Large secondary</button>
</div>
<!-- example: With icons -->
<div style="display:flex;gap:var(--k-space-2);flex-wrap:wrap;align-items:center">
  <button type="button" class="btn btn-pri btn-md"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Download</button>
  <button type="button" class="btn btn-sec btn-md"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New project</button>
  <button type="button" class="btn btn-sec btn-md">Continue <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
  <button type="button" class="btn btn-sec btn-md" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><path d="M3 6h10M17 6h4M3 12h4M11 12h10M3 18h12M19 18h2"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
  <button type="button" class="btn btn-ghost btn-md" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<!-- example: States -->
<div style="display:flex;gap:var(--k-space-2);flex-wrap:wrap;align-items:center">
  <button type="button" class="btn btn-pri btn-md" disabled>Disabled</button>
  <button type="button" class="btn btn-sec btn-md" disabled>Disabled</button>
  <button type="button" class="btn btn-pri btn-md">Enabled</button>
</div>
<!-- example: Loading -->
<div style="display:flex;gap:var(--k-space-2);flex-wrap:wrap;align-items:center">
  <button type="button" class="btn btn-pri btn-md" disabled aria-busy="true"><span class="spin" aria-hidden="true"></span> Saving…</button>
  <button type="button" class="btn btn-accent btn-md" disabled aria-busy="true"><span class="spin" aria-hidden="true"></span> Sending…</button>
</div>
