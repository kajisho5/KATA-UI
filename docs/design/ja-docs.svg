<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1500" viewBox="0 0 1280 1500" font-family="Inter, 'Noto Sans JP', -apple-system, 'Hiragino Sans', sans-serif">
  <title>Japanese component page: Button</title>
  <rect width="1280" height="1500" fill="#fafafa"/>
  <!-- header (existing) -->
  <line x1="0" x2="1280" y1="58" y2="58" stroke="#e4e4e7"/>
  <rect x="92" y="22" width="16" height="16" fill="#18181b"/><rect x="100" y="30" width="8" height="8" fill="#e83a1f"/>
  <text x="118" y="35" font-size="14" font-weight="600" fill="#18181b">KATA UI</text>
  <text x="290" y="35" font-size="13" fill="#3f3f46">Docs    Components    Blocks    Templates    Icons    Themes    Design System    Pricing</text>
  <rect x="893" y="13" width="122" height="32" rx="7" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="925" y="34" font-size="13" fill="#a1a1aa">Search  ⌘K</text>

  <!-- left nav -->
  <text x="50" y="104" font-size="11" font-weight="650" fill="#18181b" letter-spacing="1.6">日本語ドキュメント</text>
  <g font-size="13" fill="#3f3f46">
    <rect x="40" y="118" width="210" height="28" rx="6" fill="#f4f4f5"/>
    <text x="50" y="137" font-weight="600" fill="#18181b">Button　ボタン</text>
    <text x="50" y="169">Input　入力欄</text>
    <text x="50" y="201">Field　フィールド</text>
    <text x="50" y="233">Textarea　複数行の入力欄</text>
    <text x="50" y="265">Select　選択欄</text>
    <text x="50" y="297">Checkbox　チェックボックス</text>
    <text x="50" y="329">Radio　ラジオボタン</text>
    <text x="50" y="361">Switch　スイッチ</text>
    <text x="50" y="393">Modal　モーダル</text>
    <text x="50" y="425">Dropdown　ドロップダウン</text>
  </g>
  <text x="50" y="470" font-size="11" font-weight="650" fill="#18181b" letter-spacing="1.6">GETTING STARTED</text>
  <g font-size="13" fill="#3f3f46"><text x="50" y="500">Introduction</text><text x="50" y="532">Getting Started</text><text x="50" y="564">…（今の左の一覧はそのまま）</text></g>
  <text x="50" y="606" font-size="11" fill="#a1a1aa">↑ 追加するのは上の10項目だけ</text>

  <!-- main -->
  <text x="317" y="104" font-size="13" fill="#71717a"><tspan fill="#18181b">日本語ドキュメント</tspan> / フォームと入力 / Button</text>
  <text x="317" y="148" font-size="30" font-weight="700" fill="#18181b">Button</text>
  <text x="428" y="148" font-size="17" fill="#52525b">ボタン</text>
  <rect x="490" y="128" width="62" height="20" rx="10" fill="#d1fae5"/><text x="521" y="142" font-size="10" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="1">STABLE</text>
  <rect x="1150" y="124" width="90" height="30" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="1195" y="144" font-size="13" fill="#18181b" text-anchor="middle">English →</text>
  <text x="317" y="188" font-size="15" fill="#3f3f46">主な操作・もう一つの操作・削除などの操作に使うボタンです。</text>
  <text x="317" y="214" font-size="15" fill="#3f3f46">押せない状態と、読み込み中の見本も入っています。</text>

  <!-- preview + code (same as English page) -->
  <text x="317" y="262" font-size="11" font-weight="600" fill="#71717a" letter-spacing="1.6">見本</text>
  <g font-size="12">
    <rect x="782" y="246" width="136" height="28" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/><rect x="786" y="250" width="66" height="20" rx="5" fill="#18181b"/>
    <text x="819" y="264" fill="#fff" text-anchor="middle">Desktop</text><text x="884" y="264" fill="#3f3f46" text-anchor="middle">Mobile</text>
    <rect x="928" y="246" width="110" height="28" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/><rect x="932" y="250" width="48" height="20" rx="5" fill="#18181b"/>
    <text x="956" y="264" fill="#fff" text-anchor="middle">Light</text><text x="1008" y="264" fill="#3f3f46" text-anchor="middle">Dark</text>
  </g>
  <rect x="317" y="284" width="454" height="206" rx="14" fill="#f4f4f5" stroke="#e4e4e7"/>
  <g font-size="14">
    <rect x="348" y="314" width="84" height="38" rx="7" fill="#18181b"/><text x="390" y="338" fill="#fff" text-anchor="middle">Primary</text>
    <rect x="444" y="314" width="104" height="38" rx="7" fill="#fff" stroke="#e4e4e7"/><text x="496" y="338" fill="#18181b" text-anchor="middle">Secondary</text>
    <text x="596" y="338" fill="#52525b" text-anchor="middle">Ghost</text>
    <rect x="644" y="314" width="80" height="38" rx="7" fill="#33a6b8"/><text x="684" y="338" fill="#0b2a30" text-anchor="middle">Accent</text>
    <rect x="348" y="366" width="74" height="38" rx="7" fill="#cc2b2b"/><text x="385" y="390" fill="#fff" text-anchor="middle">Delete</text>
    <rect x="434" y="366" width="90" height="38" rx="7" fill="#a1a1aa"/><text x="479" y="390" fill="#fff" text-anchor="middle">Disabled</text>
  </g>
  <text x="544" y="470" font-size="11" fill="#71717a" text-anchor="middle">英語版と同じ preview.html を表示（日本語用のコピーは作らない）</text>
  <rect x="795" y="284" width="445" height="206" rx="14" fill="#18181b"/>
  <rect x="805" y="296" width="54" height="24" rx="5" fill="#27272a"/><text x="832" y="312" font-size="11" fill="#fff" text-anchor="middle">HTML</text><text x="886" y="312" font-size="11" fill="#a1a1aa" text-anchor="middle">CSS</text>
  <g font-size="11" fill="#e4e4e7" font-family="'Space Mono', ui-monospace, monospace">
    <text x="813" y="350">&lt;button type="button" class="btn btn-pri…</text>
    <text x="813" y="372">&lt;button type="button" class="btn btn-sec…</text>
    <text x="813" y="394">&lt;button type="button" class="btn btn-ghost…</text>
  </g>
  <text x="1210" y="474" font-size="11" fill="#d4d4d8" text-anchor="end">コピー</text>

  <!-- install -->
  <text x="317" y="548" font-size="18" font-weight="650" fill="#18181b">導入</text>
  <rect x="317" y="564" width="923" height="48" rx="10" fill="#18181b"/>
  <text x="337" y="593" font-size="12" fill="#e4e4e7" font-family="'Space Mono', ui-monospace, monospace">npx @kajisho5/kataui add button</text>
  <text x="1210" y="593" font-size="11" fill="#d4d4d8" text-anchor="end">コピー</text>
  <g font-size="14" fill="#3f3f46">
    <text x="317" y="640">手動で入れる場合：</text>
    <text x="333" y="666">1. tokens.css をページで一度だけ読み込む</text>
    <text x="333" y="692">2. CSS タブの中身を自分のスタイルシートに貼る</text>
    <text x="333" y="718">3. HTML タブの中身を、使いたい場所に貼る</text>
  </g>

  <!-- usage -->
  <text x="317" y="772" font-size="18" font-weight="650" fill="#18181b">使いどころ</text>
  <g font-size="15" fill="#3f3f46">
    <text x="317" y="804">1つの画面で、主な操作（Primary）は1つだけにします。</text>
    <text x="317" y="832">それ以外の選択肢は Secondary、目立たせなくてよい操作は Ghost を使います。</text>
    <text x="317" y="860">取り消せない操作（削除など）には Delete を使い、確認のダイアログと組み合わせます。</text>
  </g>

  <!-- a11y -->
  <text x="317" y="914" font-size="18" font-weight="650" fill="#18181b">アクセシビリティ</text>
  <g font-size="15" fill="#3f3f46">
    <text x="317" y="946">ブラウザ標準の &lt;button&gt; を使い、type を必ず書きます。JavaScript は使いません。</text>
    <text x="317" y="974">キーボードで選ぶと、周りに枠（--k-ring）が出ます。</text>
  </g>
  <rect x="317" y="994" width="560" height="114" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-size="13"><text x="337" y="1020" font-weight="600" fill="#52525b">キー</text><text x="537" y="1020" font-weight="600" fill="#52525b">動き</text></g>
  <line x1="317" x2="877" y1="1032" y2="1032" stroke="#e4e4e7"/>
  <g font-size="14" fill="#18181b">
    <text x="337" y="1058">Tab</text><text x="537" y="1058">次のボタンへ移動</text>
    <text x="337" y="1090">Enter / Space</text><text x="537" y="1090">押す</text>
  </g>

  <!-- english only -->
  <text x="317" y="1162" font-size="18" font-weight="650" fill="#18181b">英語版にだけある情報</text>
  <rect x="317" y="1178" width="923" height="96" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-size="14" fill="#3f3f46">
    <text x="337" y="1208">静的チェックの結果 · 部品の構造（Anatomy） · 読むトークン · 関連する部品</text>
    <text x="337" y="1240" fill="#18181b" text-decoration="underline">英語版の Button ページで見る →</text>
  </g>

  <!-- footer note -->
  <line x1="317" x2="1240" y1="1316" y2="1316" stroke="#e4e4e7"/>
  <text x="317" y="1344" font-size="12" fill="#71717a">この訳は、英語版の 2026-11-07 の内容をもとにしています。英語版の文が変わると、テストで知らせます。</text>

  <!-- annotation -->
  <text x="317" y="1420" font-size="12" fill="#a1a1aa">幅640px以下：左の一覧はメニューに入り（今と同じ）、見本とコードは上下に並ぶ。</text>
</svg>
