<div style="display:grid;gap:18px;max-width:430px">
  <div class="k-field">
    <label class="lab" for="f-name">Workspace name <span class="opt">Optional</span></label>
    <input class="input" id="f-name" type="text" value="Acme Studio" aria-describedby="f-name-hint">
    <p class="hint" id="f-name-hint">Shown in menus and the sidebar. You can change it later.</p>
  </div>
  <div class="k-field" data-invalid>
    <label class="lab" for="f-mail">Billing email <span class="req">Required</span></label>
    <input class="input" id="f-mail" type="email" value="accounts@acme" aria-describedby="f-mail-err" aria-invalid="true">
    <p class="err" id="f-mail-err"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m9.5 9.5 5 5m0-5-5 5"/></svg> That address is missing its domain.</p>
  </div>
</div>
