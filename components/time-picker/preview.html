<link rel="stylesheet" href="/components/input/input.css">
<div class="k-tp" data-tp style="max-width:220px">
  <div class="wrap-in">
    <input class="input" data-tp-input type="text" value="14:30" placeholder="HH:MM" aria-label="Time" style="width:100%;padding-right:var(--k-space-10)">
    <button class="k-tp-btn" data-tp-btn type="button" aria-label="Open time picker" aria-expanded="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
  </div>
  <div class="k-tp-panel" data-tp-panel role="dialog" aria-label="Choose a time" hidden>
    <div class="k-tp-col" data-tp-h><span class="hd">HOUR</span></div>
    <div class="k-tp-col" data-tp-m><span class="hd">MIN</span></div>
  </div>
</div>
<p style="font-size:12.5px;color:var(--k-ink-3);margin-top:var(--k-space-2)">Open it, pick an hour and a minute — or just type. The panel closes on Escape or a click away.</p>
