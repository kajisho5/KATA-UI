<div class="k-tate">
  <div class="k-tate-v" aria-hidden="true"><span class="k-tate-ch d1">守</span><span class="k-tate-ch d2">破</span><span class="k-tate-ch d3">離</span></div>
  <div class="k-tate-gloss">
    <p class="en">Shuhari — the discipline of the form</p>
    <div><b><span>守</span>Shu</b><p>Obey the form. Learn the mold exactly as it is, until the hands know it.</p></div>
    <div><b><span>破</span>Ha</b><p>Break the form. Deliberately, in the open, where the break can be judged.</p></div>
    <div><b><span>離</span>Ri</b><p>Leave the form. The mold made the work; it does not get to keep it.</p></div>
  </div>
</div>
