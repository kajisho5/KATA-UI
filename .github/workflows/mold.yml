name: Mold ratchet
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cli:
    name: CLI / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run CLI safety tests
        run: npm test --prefix cli
      - name: Inspect the package without publishing
        working-directory: cli
        run: npm pack --dry-run
  mold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the complete checker
        shell: bash
        run: |
          result=0
          python3 -W error::SyntaxWarning check.py --json /tmp/mold-results.json || result=$?
          if [ "$result" -gt 1 ]; then exit "$result"; fi
          test -s /tmp/mold-results.json
      - name: Enforce committed and trusted base baselines
        env:
          MOLD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -W error::SyntaxWarning -m tools.mold_ratchet --report /tmp/mold-results.json --reference-ref "$MOLD_BASE_SHA"
      - name: Run CLI safety and mold tests
        run: npm test --prefix cli
      - name: Run regression tests
        run: python3 -W error::SyntaxWarning -m unittest discover -s tests -p 'test_*.py'
      - name: Verify the UI template and remove its temporary target
        run: python3 -W error::SyntaxWarning -m tools.verify_template --json /tmp/mold-template-result.json
      - name: Build the website
        run: python3 -W error::SyntaxWarning build.py
      - name: Verify generated audit surfaces
        run: |
          python3 -W error::SyntaxWarning -m tools.mold_publish --check
          python3 -W error::SyntaxWarning -m tools.verify_mold_distribution
      - name: Install Playwright Chromium for the focus-ring measurement
        run: |
          python3 -m pip install -r tools/agent-requirements.txt
          python3 -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python3 -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Measure keyboard focus visibility in light and dark
        run: python3 -W error::SyntaxWarning -m tools.verify_focus_ring --check --output /tmp/focus-ring
      - name: Run part browser regressions that need Chromium
        # The regression step above runs before Chromium is installed, so these skip there.
        run: python3 -W error::SyntaxWarning -m unittest tests.test_button_browser tests.test_input_browser tests.test_field_browser tests.test_textarea_browser tests.test_select_browser tests.test_checkbox_browser tests.test_radio_browser tests.test_switch_browser tests.test_overlay_instances tests.test_dropdown_browser tests.test_popover_browser tests.test_tooltip_browser tests.test_toast_browser tests.test_card_browser tests.test_tabs_browser tests.test_accordion_browser tests.test_badge_browser tests.test_alert_browser tests.test_table_browser tests.test_pagination_browser tests.test_breadcrumbs_browser tests.test_alert_dialog_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mold-audit
          path: |
            /tmp/mold-results.json
            /tmp/mold-template-result.json
            mold-baseline.json
            dist/mold-results.json
            /tmp/focus-ring/results.json
