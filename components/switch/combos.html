<!-- parts: badge, card -->
<!-- combo: Feature flags, on a card -->
<!-- note: Switches report state; Badges name it. On a Card the three rows become one settings surface — the pattern behind most admin pages. -->
<div class="k-card" style="max-width:460px;width:100%">
  <div class="k-card-h"><div><h3>Feature flags</h3><p>Rollouts for this workspace.</p></div></div>
  <div class="k-card-b" style="display:grid;gap:13px">
    <div style="display:flex;align-items:center;gap:10px"><span class="switchrow"><label class="switch asagi"><input type="checkbox" checked><span class="tr"></span></label>New editor</span><span style="margin-left:auto"><span class="badge asagi"><i></i>Live</span></span></div>
    <div style="display:flex;align-items:center;gap:10px"><span class="switchrow"><label class="switch asagi"><input type="checkbox" checked><span class="tr"></span></label>Inline comments</span><span style="margin-left:auto"><span class="badge yamabuki"><i></i>Beta</span></span></div>
    <div style="display:flex;align-items:center;gap:10px"><span class="switchrow"><label class="switch"><input type="checkbox"><span class="tr"></span></label>Public API v2</span><span style="margin-left:auto"><span class="badge">Off</span></span></div>
  </div>
</div>
