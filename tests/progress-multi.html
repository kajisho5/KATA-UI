<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../logo/favicon.svg"><title>progress multi-instance</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/progress/progress.css"><style>body{font-family:var(--k-font);background:var(--k-bg);color:var(--k-ink);padding:var(--k-space-8)}section{margin-block:var(--k-space-6)}</style></head><body><h1>progress — three sets</h1><section><h2>Set 1</h2><div style="display:grid;gap:var(--k-space-4);max-width:420px;width:100%">
