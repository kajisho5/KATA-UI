<!-- example: Checkbox group -->
<div style="display:grid;gap:var(--k-space-3)">
  <label class="check"><input type="checkbox" checked>Attach the PDF invoice</label>
  <label class="check"><input type="checkbox" checked>Attach the receipt</label>
  <label class="check"><input type="checkbox">Attach the timesheet</label>
</div>
<!-- example: Radio group -->
<div style="display:grid;gap:var(--k-space-3)" role="radiogroup" aria-label="Payment timing">
  <label class="check"><input type="radio" name="ex-pay" checked>End of this month</label>
  <label class="check"><input type="radio" name="ex-pay">End of next month</label>
  <label class="check"><input type="radio" name="ex-pay">On receipt</label>
</div>
<!-- example: Disabled -->
<div style="display:grid;gap:var(--k-space-3)">
  <label class="check"><input type="checkbox" checked disabled>Terms of service (required)</label>
  <label class="check"><input type="checkbox" disabled>Beta features (not on your plan)</label>
</div>
