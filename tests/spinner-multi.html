<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../logo/favicon.svg"><title>spinner multi-instance</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/button/button.css"><link rel="stylesheet" href="../components/spinner/spinner.css"><style>body{font-family:var(--k-font);background:var(--k-bg);color:var(--k-ink);padding:var(--k-space-8)}section{margin-block:var(--k-space-6)}</style></head><body><h1>spinner — three sets</h1><section><h2>Set 1</h2><div style="display:flex;gap:var(--k-space-5);align-items:center;flex-wrap:wrap">

</div>
</section><section><h2>Set 2</h2><div style="display:flex;gap:var(--k-space-5);align-items:center;flex-wrap:wrap">

  <span class="k-spinner" data-size="lg" role="status" aria-label="Loading"></span>

</div>
</section><section dir="rtl"><h2>Set 3</h2><div style="display:flex;gap:var(--k-space-5);align-items:center;flex-wrap:wrap">
  <span class="k-spinner" data-size="sm" role="status" aria-label="Loading"></span>
  <span class="k-spinner" role="status" aria-label="Loading"></span>
  <span class="k-spinner" data-size="lg" role="status" aria-label="Loading"></span>
  <button type="button" class="btn btn-sec btn-md" disabled><span class="k-spinner" data-size="sm"></span> Saving…</button>
</div>
</section></body></html>
