<!-- example: Error -->
<div style="display:grid;gap:var(--k-space-1);max-width:420px">
  <label style="display:grid;gap:var(--k-space-1);font-size:var(--k-text-sm);font-weight:550">Reason for the refund<textarea class="k-textarea" rows="3" aria-invalid="true"></textarea></label>
  <span style="font-size:var(--k-text-sm);color:var(--k-danger-ink)">Tell us what went wrong, in a sentence or two.</span>
</div>
<!-- example: Disabled and read-only -->
<div style="display:grid;gap:var(--k-space-3);max-width:420px">
  <label style="display:grid;gap:var(--k-space-1);font-size:var(--k-text-sm);font-weight:550">Archived note<textarea class="k-textarea" rows="2" disabled>Locked after the release was published.</textarea></label>
  <label style="display:grid;gap:var(--k-space-1);font-size:var(--k-text-sm);font-weight:550">Webhook payload<textarea class="k-textarea" rows="2" readonly>{"event":"release.published","id":"rel_4821"}</textarea></label>
</div>
