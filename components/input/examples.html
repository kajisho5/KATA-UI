<!-- example: Hint and error -->
<div style="display:grid;gap:var(--k-space-3);max-width:340px">
  <div class="field"><label>Workspace name<input class="input" value="acme-studio"></label><span class="hint">Shown on invoices and emails</span></div>
  <div class="field"><label>Workspace URL<input aria-invalid="true" class="input errb" value="acme studio"></label><span class="err">Letters, numbers and hyphens only</span></div>
</div>
<!-- example: Search -->
<div style="max-width:340px">
  <div class="field"><label>Search<span class="searchwrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="color:var(--k-ink-3)" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" placeholder="Filter by name…"></span></label></div>
</div>
<!-- example: Disabled and read-only -->
<div style="display:grid;gap:var(--k-space-3);max-width:340px">
  <div class="field"><label>Billing email<input class="input" value="owner@acme.example" disabled></label><span class="hint">Only the workspace owner can change this</span></div>
  <div class="field"><label>Account ID<input class="input" value="acct_8f42" readonly></label></div>
</div>
