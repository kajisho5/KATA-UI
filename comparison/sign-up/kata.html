/* KATA field 1.1.0 — kata-ui.dev/components/field — requires mold >= 4 */
.k-field{display:grid;gap:var(--k-space-2);font-family:var(--k-font);text-align:start}
.k-field .lab{display:flex;align-items:baseline;gap:var(--k-space-2);font-size:var(--k-text-base);font-weight:550;color:var(--k-ink)}
.k-field .req{font-size:var(--k-text-xs);font-weight:500;color:var(--k-danger-ink)}
.k-field .opt{font-size:var(--k-text-xs);font-weight:500;color:var(--k-ink-3)}
.k-field .hint{font-size:var(--k-text-sm);color:var(--k-ink-3);line-height:var(--k-lh-small)}
.k-field .err{display:flex;gap:var(--k-space-1);align-items:center;font-size:var(--k-text-sm);font-weight:500;color:var(--k-danger-ink)}
.k-field[data-invalid] input,.k-field[data-invalid] textarea,.k-field[data-invalid] select{border-color:var(--k-danger)}
/* A label that wraps its control: text and badge on the first line, the control below at full width. */
.k-field .lab:has(> :is(input,textarea,select,.k-select)){flex-wrap:wrap;row-gap:var(--k-space-2)}
.k-field .lab > :is(input,textarea,select,.k-select){flex-basis:100%}
/* Controls size to the field including their padding and border, so a 100% wide input does not overflow it. */
.k-field :is(input,textarea,select){box-sizing:border-box;max-width:100%}

</style>
<!-- KATA part: alert (kata-ui.dev/registry.json) -->
<style>
/* KATA alert 1.1.0 — kata-ui.dev/components/alert — requires mold >= 4 */
/* KATA Alert */
.k-alert{display:flex;gap:var(--k-space-2);padding:var(--k-space-3) var(--k-space-3);border:1px solid var(--k-accent-line);border-radius:var(--k-radius-lg);background:var(--k-accent-bg);color:var(--k-ink);font-size:var(--k-text-base);line-height:var(--k-lh-body);letter-spacing:.012em}
.k-alert svg{flex:none;margin-top:var(--k-space-px);color:var(--k-accent-ink)}
.k-alert b{font-weight:600}
.k-alert p{color:var(--k-ink-2)}
.k-alert[data-tone="success"]{background:var(--k-success-bg);border-color:var(--k-success-line)}
.k-alert[data-tone="success"] svg{color:var(--k-success-ink)}
.k-alert[data-tone="warning"]{background:var(--k-yamabuki-bg);border-color:var(--k-yamabuki-line)}
.k-alert[data-tone="warning"] svg{color:var(--k-yamabuki-ink)}
.k-alert[data-tone="danger"]{background:var(--k-danger-bg);border-color:var(--k-danger-line)}
.k-alert[data-tone="danger"] svg{color:var(--k-danger-ink)}

</style>
<!-- KATA part: login (kata-ui.dev/registry.json) -->
<style>
/* KATA login 1.1.0 — kata-ui.dev/blocks/login — requires mold >= 4 */
.login-card{max-width:368px;margin:0 auto;background:var(--k-bg);border:1px solid var(--k-line);border-radius:var(--k-radius-xl);padding:var(--k-space-7) var(--k-space-7);font-family:var(--k-font);color:var(--k-ink);text-align:start}
.login-mark{display:grid;place-items:center;color:var(--k-ink)}
.login-h{margin-top:var(--k-space-3);text-align:center;font-size:var(--k-text-xl);font-weight:600;letter-spacing:-.015em}
.login-sub{margin-top:var(--k-space-1);text-align:center;font-size:var(--k-text-base);color:var(--k-ink-2)}
.login-card .field{margin-top:var(--k-space-4)}
.login-row{display:flex;align-items:center;justify-content:space-between;margin-top:var(--k-space-3);font-size:var(--k-text-base)}
.login-link{color:var(--k-accent-ink);text-decoration:none}
.login-cta{width:100%;justify-content:center;margin-top:var(--k-space-4)}
.login-card .k-sep-label{margin-top:var(--k-space-4)}
.login-foot{margin-top:var(--k-space-4);text-align:center;font-size:var(--k-text-base);color:var(--k-ink-2)}
.login-foot a{color:var(--k-accent-ink);text-decoration:none;font-weight:550}

</style>
<!-- Page layout -->
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--k-bg-soft);color:var(--k-ink);font-family:var(--k-font);line-height:1.5}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
.page{padding:var(--k-space-8) var(--k-space-4)}
.wrap{max-width:1080px;margin:0 auto}
.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
@media (max-width:560px){.page{padding:var(--k-space-4)}}
.page-center{min-height:100vh;display:grid;place-items:center}
.center-box{width:100%;max-width:400px}
.stack{display:grid;gap:var(--k-space-4);margin-top:var(--k-space-5)}
.k-field .k-select,.k-field .k-select select{width:100%}
.su-status:not(:empty){margin-top:var(--k-space-4)}

</style>
</head>
<body>
<main class="page page-center">
  <div class="center-box">
    <form class="login-card" id="su-form" action="#" novalidate aria-labelledby="su-title">
      <div class="login-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><rect x="10" y="10" width="4" height="4" rx="1.2"/></svg></div>
      <h1 class="login-h" id="su-title">Create your Tallyboard account</h1>
      <p class="login-sub">Free for teams of up to 5 people.</p>
      <div class="stack">
        <div class="k-field" data-msg="Enter your full name.">
          <label class="lab" for="su-name">Full name</label>
          <input class="input" id="su-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="k-field" data-msg="Enter a work email address, for example name@company.com.">
          <label class="lab" for="su-email">Work email</label>
          <input class="input" id="su-email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required>
        </div>
        <div class="k-field" data-msg="Your password does not meet the rules above.">
          <label class="lab" for="su-pass">Password</label>
          <input class="input" id="su-pass" name="password" type="password" autocomplete="new-password" minlength="12" required>
          <p class="hint">At least 12 characters, with at least one number and one symbol.</p>
        </div>
        <div class="k-field" data-msg="Choose your company size.">
          <label class="lab" for="su-size">Company size</label>
          <span class="k-select"><select id="su-size" name="size" required><option value="" selected disabled>Select a size</option><option value="1-10">1–10</option><option value="11-50">11–50</option><option value="51-200">51–200</option><option value="201+">201+</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
        </div>
        <div class="k-field" data-msg="Accept the terms to create an account.">
          <label class="check"><input type="checkbox" id="su-terms" name="terms" required>I accept the Terms of Service and Privacy Policy</label>
        </div>
      </div>
      <button type="submit" class="btn btn-pri btn-lg login-cta">Create account</button>
      <div class="su-status" id="su-status" role="status"></div>
      <p class="login-foot">Already have an account? <a href="#">Sign in</a></p>
    </form>
  </div>
</main>
<!-- KATA part: field (kata-ui.dev/registry.json) -->
<script>
/* KATA field 1.1.0 — kata-ui.dev/components/field — requires mold >= 4 */
// Field: links the hint and, while the field is invalid, the error to the control
// with aria-describedby, and keeps aria-invalid in step with data-invalid. Existing
// IDs are kept; missing ones are generated, so a pasted sample can appear twice.
// When data-invalid is added after load (for example on submit), the error gets
// role="alert" so it is announced once; it is not announced while typing.
(() => {
  let nextId = 0;
  function ensureId(element, suffix) {
    if (element.id) return element.id;
    let id;
    do { id = `kata-field-${++nextId}-${suffix}`; } while (document.getElementById(id));
    element.id = id;
    return id;
  }

  function sync(field, announce) {
    const control = field.querySelector('input, textarea, select');
    if (!control) return;
    const label = field.querySelector('label');
    if (label && !label.contains(control) && !label.htmlFor) label.htmlFor = ensureId(control, 'control');
    const hint = field.querySelector('.hint');
    const err = field.querySelector('.err');
    const invalid = field.hasAttribute('data-invalid');
    const own = [hint, err].filter(Boolean).map(el => el.id).filter(Boolean);
    const ids = (control.getAttribute('aria-describedby') || '').split(/\s+/).filter(id => id && !own.includes(id));
    if (hint) ids.push(ensureId(hint, 'hint'));
    if (err && invalid) ids.push(ensureId(err, 'error'));
    if (ids.length) control.setAttribute('aria-describedby', ids.join(' '));
    else control.removeAttribute('aria-describedby');
    if (invalid) control.setAttribute('aria-invalid', 'true');
    else control.removeAttribute('aria-invalid');
    if (err) {
      if (invalid && announce) err.setAttribute('role', 'alert');
      else if (!invalid) err.removeAttribute('role');
    }
  }

  document.querySelectorAll('.k-field').forEach(field => {
    if (field.hasAttribute('data-kata-ready')) return;
    field.setAttribute('data-kata-ready', '');
    sync(field, false);
    new MutationObserver(() => sync(field, true)).observe(field, { attributes: true, attributeFilter: ['data-invalid'] });
  });
})();

</script>
<!-- Page behavior -->
<script>
(() => {
  const form = document.getElementById('su-form');
  const status = document.getElementById('su-status');
  const rules = {
    'su-name': el => el.value.trim().length > 0,
    'su-email': el => el.value.trim() !== '' && el.checkValidity(),
    'su-pass': el => el.value.length >= 12 && /\d/.test(el.value) && /[^A-Za-z0-9\s]/.test(el.value),
    'su-size': el => el.value !== '',
    'su-terms': el => el.checked
  };
  function setInvalid(field, invalid) {
    let err = field.querySelector('.err');
    if (invalid) {
      if (!err) {
        err = document.createElement('p');
        err.className = 'err';
        err.textContent = field.dataset.msg;
        field.append(err);
      }
      field.setAttribute('data-invalid', '');
    } else if (field.hasAttribute('data-invalid')) {
      field.removeAttribute('data-invalid');
      // Let the Field part unlink the message first, then remove it.
      setTimeout(() => { if (!field.hasAttribute('data-invalid') && err) err.remove(); }, 0);
    }
  }
  function check(id) {
    const control = document.getElementById(id);
    const ok = rules[id](control);
    setInvalid(control.closest('.k-field'), !ok);
    return ok;
  }
  Object.keys(rules).forEach(id => {
    const control = document.getElementById(id);
    const recheck = event => {
      if (event.isComposing) return;
      if (control.closest('.k-field').hasAttribute('data-invalid')) check(id);
    };
    control.addEventListener('input', recheck);
    control.addEventListener('change', recheck);
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    status.textContent = '';
    const failed = Object.keys(rules).filter(id => !check(id));
    if (failed.length) {
      document.getElementById(failed[0]).focus();
      return;
    }
    const email = document.getElementById('su-email').value.trim();
    const alert = document.createElement('div');
    alert.className = 'k-alert';
    alert.setAttribute('data-tone', 'success');
    alert.innerHTML = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="bevel"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></svg><div><b>Account created.</b><p></p></div>';
    alert.querySelector('p').textContent = 'Demo only: a confirmation link would go to ' + email + '.';
    status.append(alert);
  });
})();
</script>
</body>
</html>
