<!-- example: With labels -->
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
  <label style="display:grid;gap:6px;font-size:12.5px;font-weight:550">Billing cycle
    <span class="k-select"><select><option selected>Monthly</option><option>Yearly (save 17%)</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
  </label>
  <label style="display:grid;gap:6px;font-size:12.5px;font-weight:550">Currency
    <span class="k-select"><select><option selected>JPY ¥</option><option>USD $</option><option>EUR €</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
  </label>
</div>
<!-- example: Grouped options -->

</label>
