<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../logo/favicon.svg"><title>slider multi-instance</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/slider/slider.css"><style>body{font-family:var(--k-font);background:var(--k-bg);color:var(--k-ink);padding:var(--k-space-8)}section{margin-block:var(--k-space-6)}</style></head><body><h1>slider — three sets</h1><section><h2>Set 1</h2><div style="display:grid;gap:var(--k-space-4);max-width:400px">
  <label class="k-slider-row" data-slider>
    <span class="k-slider-head"><span class="k-slider-label">Volume</span><span class="k-slider-val" data-slider-val aria-hidden="true">60</span></span>
    <input class="k-slider" type="range" min="0" max="100" value="60">
  </label>
  <label class="k-slider-row" data-slider>
    <span class="k-slider-head"><span class="k-slider-label">Brightness</span><span class="k-slider-val" data-slider-val aria-hidden="true">30</span></span>
    <input class="k-slider" type="range" min="0" max="100" value="30">
  </label>
</div>
</section><section><h2>Set 2</h2><div style="display:grid;gap:var(--k-space-4);max-width:400px">
  <label class="k-slider-row" data-slider>
    <span class="k-slider-head"><span class="k-slider-label">Volume</span><span class="k-slider-val" data-slider-val aria-hidden="true">60</span></span>
    <input class="k-slider" type="range" min="0" max="100" value="60">
  </label>
  <label class="k-slider-row" data-slider>
    <span class="k-slider-head"><span class="k-slider-label">Brightness</span><span class="k-slider-val" data-slider-val aria-hidden="true">30</span></span>
    <input class="k-slider" type="range" min="0" max="100" value="30">
  </label>
</div>
</section><section dir="rtl"><h2>Set 3</h2><div style="display:grid;gap:var(--k-space-4);max-width:400px">
  <label class="k-slider-row" data-slider>
    <span class="k-slider-head"><span class="k-slider-label">Volume</span><span class="k-slider-val" data-slider-val aria-hidden="true">60</span></span>
    <input class="k-slider" type="range" min="0" max="100" value="60">
  </label>
  <label class="k-slider-row" data-slider>
    <span class="k-slider-head"><span class="k-slider-label">Brightness</span><span class="k-slider-val" data-slider-val aria-hidden="true">30</span></span>
    <input class="k-slider" type="range" min="0" max="100" value="30">
  </label>
</div>
</section><script src="../components/slider/slider.js"></script><script src="../components/slider/slider.js"></script></body></html>
